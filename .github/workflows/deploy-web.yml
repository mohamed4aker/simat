# رفع الموقع على Vercel تلقائياً مع كل تحديث.
#
# الـ workflow ده بيفضل نايم لحد ما تحط الأسرار التلاتة دي في:
#   GitHub → Settings → Secrets and variables → Actions
#     VERCEL_TOKEN        من vercel.com/account/tokens
#     VERCEL_ORG_ID       من web/.vercel/project.json بعد `vercel link`
#     VERCEL_PROJECT_ID   من نفس الملف
#
# ولو مش موجودين، بيتخطّى نفسه من غير ما يفشل.
name: نشر الموقع

on:
  push:
    branches:
      - main
      - claude/perfume-store-app-5gy0rn
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    # GitHub مش بيسمح بـ secrets في شرط الـ job، فكل خطوة بتتخطى لو التوكن مش موجود.
    steps:
      - name: مفيش توكن Vercel؟
        if: env.VERCEL_TOKEN == ''
        working-directory: .
        run: echo "VERCEL_TOKEN مش موجود — النشر بيتم من ربط Vercel بـ GitHub مباشرة."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: '22'

      - name: تثبيت أداة Vercel
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: جلب إعدادات المشروع
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: بناء الموقع
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: النشر
        if: env.VERCEL_TOKEN != ''
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "🚀 الموقع اترفع على: $URL"
          echo "### 🚀 الموقع اترفع" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
