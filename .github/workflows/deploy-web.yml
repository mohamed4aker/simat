# رفع الموقع على Vercel تلقائياً مع كل تحديث.
#
# الـ workflow ده بيفضل نايم لحد ما تحط الأسرار التلاتة دي في:
#   GitHub → Settings → Secrets and variables → Actions
#     VERCEL_TOKEN        من vercel.com/account/tokens
#     VERCEL_ORG_ID       من web/.vercel/project.json بعد `vercel link`
#     VERCEL_PROJECT_ID   من نفس الملف
#
# ولو مش موجودين، بيتخطّى نفسه من غير ما يفشل.
name: نشر الموقع

on:
  push:
    branches:
      - main
      - claude/perfume-store-app-5gy0rn
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel
    runs-on: ubuntu-latest
    # من غير التوكن، الـ job ده ما بيشتغلش أصلاً.
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت أداة Vercel
        run: npm install --global vercel@latest

      - name: جلب إعدادات المشروع
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: بناء الموقع
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: النشر
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "🚀 الموقع اترفع على: $URL"
          echo "### 🚀 الموقع اترفع" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
