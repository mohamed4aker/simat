# بيبني نسخة أندرويد جاهزة للتثبيت (APK) على سيرفرات GitHub،
# فمش محتاج تثبّت Android SDK على جهازك عشان تجرّب التطبيق.
name: بناء تطبيق أندرويد

on:
  push:
    branches:
      - claude/perfume-store-app-5gy0rn
      - main
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: تحميل المكتبات
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze

      - name: الاختبارات
        run: flutter test

      - name: بناء APK (نسخة شاملة)
        run: flutter build apk --release

      - name: بناء APK لكل معمارية (ملفات أصغر)
        run: flutter build apk --release --split-per-abi

      - name: بناء App Bundle (لجوجل بلاي)
        run: flutter build appbundle --release

      - name: تجهيز اسم الملف
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/simat-v1.0.0-build-${{ github.run_number }}-universal.apk
          # ده اللي بيشتغل على ٩٩٪ من موبايلات النهاردة وحجمه أصغر بكتير
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/simat-v1.0.0-build-${{ github.run_number }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             dist/simat-v1.0.0-build-${{ github.run_number }}-arm32.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             dist/simat-v1.0.0-build-${{ github.run_number }}.aab
          ls -lh dist

      - name: نشر نسخة للتنزيل المباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: سِمة — نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          body: |
            نسخة تجريبية من تطبيق **سِمة — SIMAT**.

            نزّل ملف **arm64** من تحت (ده اللي بيشتغل على معظم
            الموبايلات وحجمه أصغر)، ولو مااشتغلش جرّب **universal**.
            ثبّته على الموبايل عادي
            (هيطلبك تسمح بالتثبيت من مصدر غير معروف — ده طبيعي لأي
            تطبيق مش نازل من Google Play).

            **حسابات التجربة**
            - أدمن: `01000000000` / `admin123`
            - عميل: `01011112222` / `123456`
          files: |
            app/dist/simat-v1.0.0-build-${{ github.run_number }}-arm64.apk
            app/dist/simat-v1.0.0-build-${{ github.run_number }}-arm32.apk
            app/dist/simat-v1.0.0-build-${{ github.run_number }}-universal.apk
            app/dist/simat-v1.0.0-build-${{ github.run_number }}.aab

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: simat-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: رفع App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: simat-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
