# بيبني نسخة أندرويد جاهزة للتثبيت (APK) على سيرفرات GitHub،
# فمش محتاج تثبّت Android SDK على جهازك عشان تجرّب التطبيق.
name: بناء تطبيق أندرويد

on:
  push:
    branches:
      - claude/perfume-store-app-5gy0rn
      - main
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: تحميل المكتبات
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze

      - name: الاختبارات
        run: flutter test

      - name: بناء APK
        run: flutter build apk --release

      - name: بناء App Bundle (لجوجل بلاي)
        run: flutter build appbundle --release

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: simat-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: رفع App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: simat-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
