name: simat
description: "SIMAT — سِمة | تطبيق متجر العطور الفاخرة (Android & iOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  fl_chart: ^1.1.1
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/brand/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700

# أيقونة التطبيق — تتولّد من رمز سِمة:
#   flutter test tool/generate_brand_assets_test.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#F2EBE1"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  remove_alpha_ios: true
  background_color_ios: "#F2EBE1"

# شاشة البداية الأصلية:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F2EBE1"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#F2EBE1"
    image: assets/brand/splash_logo.png
    icon_background_color: "#F2EBE1"
  android: true
  ios: true
  web: false
